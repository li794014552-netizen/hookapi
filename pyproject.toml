[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookapi"
version = "0.1.0"
description = "HMAC-signed webhook receiver with SQLite storage and replay"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "httpx",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hookapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
